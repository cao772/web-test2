name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run eval:v17
      - run: npm run eval:v18
      - run: npm run eval:v19
      - uses: actions/upload-artifact@v4
        with:
          name: self-evolution-evaluation
          path: |
            eval-results/v17-evaluation.json
            eval-results/v18-diagnostics.json
            eval-results/v19-tournament.json
