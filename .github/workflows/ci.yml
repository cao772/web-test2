name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run eval:v17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v17-evaluation
          path: eval-results/v17-evaluation.json
          if-no-files-found: warn
