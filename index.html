<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个通过 Champion 正式策略、Challenger 价值影子与 Top-1 决策影子进行多阶段递归自我改进的 3D 智能体小世界" />
    <title>小小世界 · Decision Shadow Agent World</title>
    <link rel="stylesheet" href="/src/brain-v12.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V12</span></div>
            <p id="statusText">Champion 控制真实行为；Challenger 同时做价值预测和 Top-1 决策影子，两道门都通过才晋升</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">双重影子评估中</em></div>
          <small>硬规则固定 · 候选先离线过门 · 再同时做价值影子与策略决策影子 · 双门通过才晋升</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、长期记忆、Champion 策略、Challenger 价值影子与 Top-1 决策影子"></aside>

      <div class="hint glass">右下角看 Champion / Challenger 的价值预测与 Top-1 分歧 · 替代动作只有存在真实历史证据时才参与晋升判断</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v12.ts"></script>
  </body>
</html>
