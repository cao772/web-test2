<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个带 Champion 版本化、Challenger 多阶段门禁、自动回滚与固定随机种子自进化评测实验室的 3D 智能体小世界" />
    <title>小小世界 · Self-Evolution Evaluation Lab</title>
    <link rel="stylesheet" href="/src/brain-v17.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V17</span></div>
            <p id="statusText">固定随机种子隔离长跑，直接验证 Challenger、版本稳定、自动回滚和长期真实回报趋势</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">自进化评测中</em></div>
          <small>生产策略仍由 V16 守护 · V17 隔离评测不改真实 Champion · 固定种子 · 240轮长跑 · 生命周期断言 · JSON 评测报告</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、Champion 策略、版本注册表、自动回滚与自进化评测实验室"></aside>

      <div class="hint glass">右下角看自进化评测实验室 · 生命周期通过不等于长期改善已证明 · 当前基准会直接显示真实长跑结论</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v17.ts"></script>
  </body>
</html>
