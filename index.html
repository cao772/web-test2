<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个会自主探索、双人协作、递东西、追球和搭积木的 3D 微缩小世界" />
    <title>小小世界 · Dual Agent 3D Playroom</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">LIVE</span></div>
            <p id="statusText">陶陶和沫沫正在房间里慢慢逛</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">双人自主中</em></div>
          <small>会协作、会递东西、会追球</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <div class="hint glass">点积木看双人传递搭建 · 点球一起追 · 点角色可切换跟随镜头</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v5.ts"></script>
  </body>
</html>
