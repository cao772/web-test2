<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个拥有长期记忆、自适应偏好、满意度学习与自主决策的 3D 微缩智能体小世界" />
    <title>小小世界 · Adaptive Memory Agent World</title>
    <link rel="stylesheet" href="/src/brain-v8.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V8</span></div>
            <p id="statusText">陶陶和沫沫会根据需求、长期记忆和过去体验效果决定下一步</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">长期学习中</em></div>
          <small>世界事件优先 · 再按需求、经验与学习偏好决策</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、长期记忆与学习偏好"></aside>

      <div class="hint glass">右下角看长期偏好与满意度 · 每次完整体验都会微调权重 · 刷新页面学习结果仍保留</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v8.ts"></script>
  </body>
</html>
