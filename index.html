<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个带 Champion 版本化、Challenger 多阶段门禁、自动回滚、自进化长跑评测与反思瓶颈诊断的 3D 智能体小世界" />
    <title>小小世界 · Reflection Bottleneck Lab</title>
    <link rel="stylesheet" href="/src/brain-v18.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V18</span></div>
            <p id="statusText">逐次解释反思为什么被拒绝，并离线扫描窗口、学习尺度和门槛；没有安全证据就不改生产参数</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">瓶颈诊断中</em></div>
          <small>生产策略仍由 V16 守护 · V17 验证生命周期 · V18 只读归因拒绝原因并做离线参数扫描 · 不自动降低任何正式门槛</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、Champion 策略、版本注册表、自进化评测实验室与反思瓶颈诊断"></aside>

      <div class="hint glass">右下角看 V18 反思瓶颈诊断 · 59 次拒绝逐项归因 · 参数候选还要通过未来未见回放安全检查才有资格进入下一轮</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v18.ts"></script>
  </body>
</html>
