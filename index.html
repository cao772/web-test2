<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个通过 Champion 正式策略、Challenger 影子对照和多阶段晋升门进行递归自我改进的 3D 智能体小世界" />
    <title>小小世界 · Champion Challenger Agent World</title>
    <link rel="stylesheet" href="/src/brain-v11.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V11</span></div>
            <p id="statusText">Champion 控制真实行为；Challenger 只做影子预测，连续胜出后才允许晋升</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">Champion 控制中</em></div>
          <small>硬规则固定 · 候选先离线过门 · 再进入真实状态影子对照 · 胜出才晋升</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、长期记忆、Champion 策略与 Challenger 影子评估"></aside>

      <div class="hint glass">右下角看 Champion / Challenger 胜场与预测误差 · Challenger 不控制角色 · 10 条影子样本后决定晋升或淘汰</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v11.ts"></script>
  </body>
</html>
