<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个会学习自身 Planner 权重、保留长期记忆并受边界约束的 3D 自改进智能体小世界" />
    <title>小小世界 · Strategy Learning Agent World</title>
    <link rel="stylesheet" href="/src/brain-v9.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V9</span></div>
            <p id="statusText">陶陶和沫沫会记录 Planner 为什么这样选，并用结果微调决策策略</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">策略学习中</em></div>
          <small>硬规则固定 · 软策略根据长期回报受控自我调整</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、长期记忆与 Planner 策略学习"></aside>

      <div class="hint glass">右下角看 Planner 权重与最近策略回报 · 手动点击只教偏好，不修改决策策略 · 学习结果刷新后保留</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v9.ts"></script>
  </body>
</html>
