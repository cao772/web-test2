<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个带 Champion 版本化、自动回滚、自进化长跑评测、反思瓶颈诊断与多种子 Candidate Generator 锦标赛的 3D 智能体小世界" />
    <title>小小世界 · Candidate Generator Tournament</title>
    <link rel="stylesheet" href="/src/brain-v19.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V19</span></div>
            <p id="statusText">五种 Candidate Generator 在同一 proposal / held-out / future 上做多种子锦标赛；可重复安全改善才获得受控实验资格</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">生成器锦标赛</em></div>
          <small>生产策略仍由 V16 守护 · V17 验证生命周期 · V18 定位反思瓶颈 · V19 隔离比较 A~E 五种 Candidate Generator · 通过也不自动进生产</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、Champion 策略、版本注册表、自进化评测、反思瓶颈诊断与 Candidate Generator 锦标赛"></aside>

      <div class="hint glass">右下角看 V19 锦标赛 · Evolution Strategy 只有跨多个固定种子保持 safe 且 0 unsafe，才会显示为受控实验候选</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v19.ts"></script>
  </body>
</html>
