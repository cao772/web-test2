<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个通过 Champion 正式策略、Challenger 双重影子与上下文近邻反事实门进行多阶段递归自我改进的 3D 智能体小世界" />
    <title>小小世界 · Contextual Counterfactual Agent World</title>
    <link rel="stylesheet" href="/src/brain-v13.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V13</span></div>
            <p id="statusText">Champion 控制真实行为；Challenger 的替代动作还要经过相似状态近邻证据验证，才允许晋升</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">上下文反事实门控中</em></div>
          <small>硬规则固定 · 离线反思 · 价值影子 · Top-1 决策影子 · 相似状态近邻反事实 · 全部门通过才晋升</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、长期记忆、Champion 策略、Challenger 双重影子与上下文近邻反事实评估"></aside>

      <div class="hint glass">右下角看上下文近邻证据 · 替代动作只有在相似状态下存在至少两条真实历史，才会进入最终晋升判断</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v13.ts"></script>
  </body>
</html>
