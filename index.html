<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个通过 Champion 版本化、Challenger 多阶段影子评估、上下文反事实、短期轨迹世界模型、显式状态转移 rollout 与自动回滚进行递归自我改进的 3D 智能体小世界" />
    <title>小小世界 · Versioned Champion Agent</title>
    <link rel="stylesheet" href="/src/brain-v16.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V16</span></div>
            <p id="statusText">Champion 已版本化；新版本通过全部门禁后还要观察真实表现，持续退化会自动回滚到上一个稳定版本</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">版本守护中</em></div>
          <small>硬规则固定 · 多阶段 Challenger 门禁 · Champion 版本快照 · 12条真实稳定性观察 · 退化自动回滚 · 稳定后才开放下一代</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、长期记忆、Champion 策略、Challenger 多阶段影子评估、状态世界模型、Champion 版本注册表与自动回滚"></aside>

      <div class="hint glass">右下角看 Champion 版本注册表 · 新版本观察期冻结下一代 Challenger · 12条真实决策后稳定或自动回滚到上一安全版本</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v16.ts"></script>
  </body>
</html>
