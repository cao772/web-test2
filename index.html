<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#efe2cc" />
  <meta name="description" content="小小世界稳定可玩模式：两个自主角色、玩具互动、V16 策略评分与独立 V22 评测实验室。" />
  <title>小小世界 · Play Mode</title>
  <link rel="stylesheet" href="/src/play.css" />
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas><div class="play-vignette" aria-hidden="true"></div>
  <div id="playBoot" class="glass">正在启动 3D 小世界…</div>
  <header class="play-top">
    <div class="brand glass"><div class="brand-mark">✦</div><div><div class="brand-line"><strong>小小世界</strong><span class="badge">PLAY</span></div><p id="statusText">正在启动两个自主角色…</p></div></div>
    <div class="play-controls glass" aria-label="场景控制"><button id="cinemaButton" class="active" title="电影镜头">◉</button><button id="dayButton" title="昼夜">☀︎</button><button id="pauseButton" title="暂停自主行动">Ⅱ</button><button id="resetButton" title="镜头复位">⌂</button><a href="/lab.html" title="V22 评测实验室">⌁</a></div>
  </header>
  <aside class="toy-dock glass"><div class="dock-head"><b>玩具百宝箱</b><span>先点右侧角色，再点玩具</span></div><div id="toyGrid" class="toy-grid"></div></aside>
  <aside id="brain" class="brain glass"><div class="brain-title"><b>角色状态</b><span>加载 V16 策略评分中…</span></div></aside>
  <div class="play-hint glass">拖动旋转 · 滚轮缩放 · 角色会自己玩 · 左下可手动派玩具 · ⌁ 打开 V22 实验室</div>
  <div id="toast" class="toast glass"></div>
  <noscript>请启用 JavaScript 运行 3D 小世界。</noscript>
</div>
<script type="module" src="/src/boot-play.ts"></script>
</body>
</html>
