<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个会自主探索、发现事故、双人收拾、追逐、传球和社交互动的 3D 微缩小世界" />
    <title>小小世界 · Autonomous Social 3D Playroom</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">LIVE</span></div>
            <p id="statusText">陶陶和沫沫正在自己决定下一步做什么</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">双人自主中</em></div>
          <small>会收拾、会追逐、会传球、会打招呼</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <div class="hint glass">球撞散积木后会自动收拾 · 可点追逐/招手 · 点角色切换跟随镜头</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v6.ts"></script>
  </body>
</html>
