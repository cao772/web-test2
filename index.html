<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个带 Champion 版本化、自动回滚、自进化评测、Candidate Generator 锦标赛与双生成器正式门禁影子的 3D 智能体小世界" />
    <title>小小世界 · Dual Generator Shadow</title>
    <link rel="stylesheet" href="/src/brain-v20.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V20</span></div>
            <p id="statusText">旧生成器与 Evolution Strategy 在相同真实历史和相同后续数据上进入同一条 V10~V16 正式门禁影子链</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">双生成器影子</em></div>
          <small>生产策略仍由 V16 守护 · V17 验证生命周期 · V18 定位瓶颈 · V19 找到 ES 离线安全信号 · V20 继续走正式价值/决策/上下文/轨迹/状态门 · 不自动替换生产生成器</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求、Champion 策略、版本注册表、自进化评测、生成器锦标赛与双生成器正式门禁影子"></aside>

      <div class="hint glass">右下角看 V20 双生成器门禁赛道 · 当前 ES 已过离线与价值影子，但 Top-1 决策门仍未证明，所以正式生成器继续保持 V16</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v20.ts"></script>
  </body>
</html>
