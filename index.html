<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个会自己探索、绕障碍、攀爬和互动的 3D 微缩玩耍空间" />
    <title>小小世界 · 3D Adventure Playroom</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">LIVE</span></div>
            <p id="statusText">正在房间里慢慢逛</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">自动探索中</em></div>
          <small>会绕障碍、会攀爬</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <div class="hint glass">拖动旋转 · 点击城堡看攀爬滑梯 · 点击果冻 / 软球互动</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v3.ts"></script>
  </body>
</html>
