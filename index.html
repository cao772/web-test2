<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3e8d4" />
    <meta name="description" content="一个拥有角色需求、记忆、个性偏好与自主决策的 3D 微缩小世界" />
    <title>小小世界 · Needs & Memory Agent World</title>
    <link rel="stylesheet" href="/src/brain-v7.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass">
          <div class="brand-mark">✦</div>
          <div>
            <div class="brand-row"><strong>小小世界</strong><span class="live-dot">V7</span></div>
            <p id="statusText">陶陶和沫沫会根据自己的需求、记忆和偏好决定下一步</p>
          </div>
        </div>

        <div class="controls glass" aria-label="场景控制">
          <button id="cinemaButton" class="active" title="电影镜头">◉</button>
          <button id="dayButton" title="切换昼夜">☀︎</button>
          <button id="pauseButton" title="暂停探索">Ⅱ</button>
          <button id="resetButton" title="恢复镜头">⌂</button>
        </div>
      </header>

      <aside class="toybox glass">
        <div class="toybox-title">
          <div><span>玩具百宝箱</span><em id="autoBadge">需求驱动中</em></div>
          <small>世界事件优先 · 再按需求和偏好决策</small>
        </div>
        <div id="toyButtons" class="toy-buttons"></div>
      </aside>

      <aside id="brainPanel" class="brain-panel glass" aria-label="角色需求与记忆"></aside>

      <div class="hint glass">右下角看两个人当前需求 · 最近做过的事会降低重复概率 · 累了会自己去沙发休息</div>
      <div id="toast" class="toast glass" role="status"></div>
    </div>
    <script type="module" src="/src/main-v7.ts"></script>
  </body>
</html>
